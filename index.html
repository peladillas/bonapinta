<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONAPINTA – Pintura de Hogares</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FDF6EC;
    --gold: #C9973A;
    --gold-dark: #A07828;
    --navy: #1A2744;
    --navy-light: #243460;
    --green: #2E6B55;
    --green-btn: #245C47;
    --white: #ffffff;
    --shadow: 0 8px 32px rgba(26,39,68,0.18);
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* Painted texture background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(201,151,58,0.13) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(46,107,85,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 100% 100% at 50% 50%, rgba(26,39,68,1) 0%, rgba(15,24,48,1) 100%);
    z-index: 0;
  }

  /* Subtle brush stroke SVG pattern */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    z-index: 0;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(253, 246, 236, 0.97);
    border-radius: 0;
    padding: clamp(28px, 6vh, 60px) clamp(24px, 6vw, 80px);
    width: 100vw;
    min-height: 100vh;
    min-height: 100dvh;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    border-top: 6px solid var(--gold);
    animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-wrap {
    background: var(--navy);
    border-radius: 20px;
    padding: clamp(16px, 3vw, 24px) clamp(24px, 5vw, 48px);
    margin-bottom: clamp(24px, 4vh, 44px);
    box-shadow: 0 6px 24px rgba(26,39,68,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 560px;
  }

  .logo-wrap svg {
    width: 100%;
    max-width: 420px;
    height: auto;
    display: block;
  }

  .tagline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5.5vw, 3.2rem);
    color: var(--navy);
    font-weight: 900;
    text-align: center;
    line-height: 1.18;
    margin-bottom: clamp(10px, 2vh, 18px);
    letter-spacing: -0.5px;
  }

  .tagline span {
    color: var(--gold-dark);
  }

  .description {
    font-size: clamp(1.15rem, 2.8vw, 1.5rem);
    color: #4a5568;
    text-align: center;
    line-height: 1.6;
    margin-bottom: clamp(24px, 4vh, 44px);
    max-width: 540px;
    font-weight: 400;
  }

  .divider {
    width: 70px;
    height: 4px;
    background: var(--gold);
    border-radius: 2px;
    margin: 0 auto clamp(20px, 3.5vh, 36px);
  }

  .cta-label {
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    color: #888;
    text-align: center;
    margin-bottom: clamp(14px, 2.5vh, 24px);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.5vh, 22px);
    width: 100%;
    max-width: 540px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    border: none;
    border-radius: 20px;
    padding: clamp(20px, 3.5vh, 30px) clamp(24px, 4vw, 40px);
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.13s, box-shadow 0.13s, filter 0.13s;
    -webkit-tap-highlight-color: transparent;
    min-height: clamp(80px, 12vh, 110px);
  }

  .btn:active {
    transform: scale(0.97);
    filter: brightness(0.94);
  }

  .btn-call {
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 6px 24px rgba(26,39,68,0.25);
  }

  .btn-call:hover {
    background: var(--navy-light);
    box-shadow: 0 10px 32px rgba(26,39,68,0.32);
  }

  .btn-whatsapp {
    background: #25D366;
    color: var(--white);
    box-shadow: 0 6px 24px rgba(37,211,102,0.3);
  }

  .btn-whatsapp:hover {
    background: #1ebe5d;
    box-shadow: 0 10px 32px rgba(37,211,102,0.4);
  }

  .btn-icon {
    width: clamp(36px, 5vw, 48px);
    height: clamp(36px, 5vw, 48px);
    flex-shrink: 0;
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.15;
  }

  .btn-text-main {
    font-size: clamp(1.3rem, 3.5vw, 1.7rem);
    font-weight: 700;
  }

  .btn-text-sub {
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    font-weight: 400;
    opacity: 0.82;
    margin-top: 3px;
  }

  .footer-note {
    margin-top: clamp(18px, 3vh, 32px);
    font-size: clamp(0.9rem, 1.8vw, 1.05rem);
    color: #aaa;
    text-align: center;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <!-- HEADLINE -->
  <h1 class="tagline">Pintamos tu hogar<br><span>con cuidado y calidad</span></h1>

  <div class="divider"></div>

  <p class="description">
    Servicio de pintura profesional para el interior y exterior de su vivienda.<br>
    Presupuesto <strong>sin compromiso</strong>.
  </p>

  <p class="cta-label">Contáctenos ahora</p>

  <div class="buttons">

    <!-- LLAMADA -->

      <span class="btn-text">

    <!-- WHATSAPP -->

        <span class="btn-text-main">WhatsApp</span>
        <span class="btn-text-sub">Escríbanos aquí</span>
      </span>
    </a>

  </div>

  <p class="footer-note">Barcelona · Servicio a domicilio</p>

</div>

<script>
  (function() {
    var p = ['\x36\x39\x33', '\x36\x38\x37', '\x33\x37\x34'];
    var cc = '\x2B\x33\x34';
    var num = p[0] + p[1] + p[2];
    var full = cc + num;
    var display = p[0] + '\u00A0' + p[1] + '\u00A0' + p[2];

    document.getElementById('phone-display').textContent = display;
    document.getElementById('btn-call').href = 'tel:' + full;

    var msg = encodeURIComponent('Hola, me gustar\u00EDa pedir un presupuesto de pintura.');
    document.getElementById('btn-wa').href = 'https://wa.me/' + full.replace('+','') + '?text=' + msg;
  })();
</script>
